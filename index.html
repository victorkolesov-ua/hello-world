<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <header class="page-header">
    <div class="page-header__content">
      <p class="eyebrow">Task Planner</p>
      <h1>Менеджер задач</h1>
    </div>
  </header>

  <main class="app">
    <section class="panel panel--form" aria-labelledby="add-task-title">
      <header class="panel__header">
        <h2 id="add-task-title">Додати нову задачу</h2>
      </header>

      <form id="task-form" class="task-form" novalidate>
        <div class="field">
          <label for="task-description">Опис задачі</label>
          <input id="task-description" name="description" type="text" maxlength="120"
            placeholder="Наприклад: Підготувати звіт" required />
        </div>

        <div class="field-row">
          <div class="field">
            <label for="task-date">Дата виконання</label>
            <input id="task-date" name="date" type="date" required />
          </div>

          <div class="field">
            <label for="task-time">Час виконання</label>
            <input id="task-time" name="time" type="time" required />
          </div>
        </div>

        <button type="submit" class="button button--primary">Додати задачу</button>
      </form>
    </section>

    <section class="panel panel--tasks" aria-labelledby="task-list-title">
      <header class="toolbar">
        <div class="toolbar__heading">
          <h2 id="task-list-title">Список задач</h2>
          <p id="task-counter" class="counter" aria-live="polite">0 задач</p>
        </div>

        <button type="button" id="clear-completed" class="button button--secondary">
          Очистити completed
        </button>
      </header>

      <div class="controls" role="search">
        <div class="search-field">
          <label for="task-search">Пошук</label>
          <input id="task-search" type="search" placeholder="Пошук за описом" />
        </div>

        <div class="filter-field">
          <label for="task-filter">Фільтри</label>
          <select id="task-filter">
            <option value="all">Усі</option>
            <option value="active">Активні</option>
            <option value="completed">Виконані</option>
          </select>
        </div>
      </div>

      <ul class="summary-list" aria-label="Підсумок задач">
        <li><span>Активні:</span> <strong id="active-count">0</strong></li>
        <li><span>Виконані:</span> <strong id="completed-count">0</strong></li>
      </ul>

      <div class="table-wrapper">
        <table class="task-table">
          <thead>
            <tr>
              <th scope="col">Опис задачі</th>
              <th scope="col">Дата</th>
              <th scope="col">Час</th>
              <th scope="col">Виконано</th>
              <th scope="col">Дії</th>
            </tr>
          </thead>
          <tbody id="task-table-body"></tbody>
        </table>
      </div>

      <p id="empty-state" class="empty-state">Немає задач для відображення.</p>
    </section>
  </main>

  <footer class="page-footer">
    <p>Task Manager © 2026</p>
  </footer>

  <template id="task-row-template">
    <tr class="task-row">
      <td class="task-text"></td>
      <td class="task-date"></td>
      <td class="task-time"></td>
      <td class="task-status">
        <label class="checkbox-label">
          <input type="checkbox" class="task-complete" />
          <span>Виконано</span>
        </label>
      </td>
      <td>
        <div class="task-actions">
          <button type="button" class="button button--small button--primary task-edit">Edit</button>
          <button type="button" class="button button--small button--danger task-delete">Delete</button>
        </div>
      </td>
    </tr>
  </template>

  <script src="./script.js"></script>
</body>

</html>
